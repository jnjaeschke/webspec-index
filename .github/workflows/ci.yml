name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --verbose
      - name: Check prepared effects query and record offline measurements
        run: cargo run --quiet --example benchmark_effects -- tests/fixtures/effects/performance/corpus.json > effects-benchmark.json
      - name: Upload effects measurements
        uses: actions/upload-artifact@v4
        with:
          name: effects-benchmark
          path: effects-benchmark.json

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy -- -D warnings

  no-default-features:
    name: No default features (host + wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-default-features
      - name: Host tests without default features
        run: cargo test --no-default-features --lib --verbose
      - name: Clippy without default features
        run: cargo clippy --no-default-features --lib -- -D warnings
      - name: Check wasm32 build
        run: cargo check --no-default-features --lib --target wasm32-unknown-unknown --verbose
        env:
          CC_wasm32_unknown_unknown: clang

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      - name: Build release
        run: cargo build --release --verbose

  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build
      - name: Query specs
        run: |
          for anchor in \
            "HTML#navigate" \
            "DOM#concept-tree" \
            "FETCH#concept-request" \
            "ECMA-262#sec-tostring" \
            "SELECTORS-4#specificity" \
            "CSS-DISPLAY-4#propdef-display" \
            "MEDIACAPTURE-MAIN#dom-mediatracksupportedconstraints-latency" \
            "WEBCODECS#dom-audiodecoder-configure" \
            "WEBGPU#textures" \
            "WGSL#textureload"
          do
            echo "Querying $anchor..."
            ./target/debug/webspec-index query "$anchor" | jq -e '.anchor' > /dev/null
          done

  extension:
    name: Build extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: editors/vscode
        run: npm ci
      - name: Compile TypeScript
        working-directory: editors/vscode
        run: npm run compile

  zed-extension:
    name: Build Zed extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: zed-extension
      - name: Run tests
        run: cargo test --manifest-path editors/zed/Cargo.toml --verbose
      - name: Run clippy
        run: cargo clippy --manifest-path editors/zed/Cargo.toml --target wasm32-wasip1 -- -D warnings
      - name: Build wasm extension
        run: cargo build --release --manifest-path editors/zed/Cargo.toml --target wasm32-wasip1 --verbose

  python-bindings:
    name: Python bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-bindings-${{ matrix.os }}
          workspaces: bindings/python
      - uses: astral-sh/setup-uv@v5
      - name: Format check
        working-directory: bindings/python
        run: cargo fmt -- --check
      - name: Clippy
        working-directory: bindings/python
        run: cargo clippy -- -D warnings
      - name: Build & install (uv)
        working-directory: bindings/python
        run: uv sync --extra test
      - name: Run tests
        working-directory: bindings/python
        run: uv run pytest -v

  wasm-e2e:
    name: Wasm end-to-end (Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm-e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build wasm package
        run: ./crates/webspec-index-wasm/build.sh
        env:
          CC_wasm32_unknown_unknown: clang
      - name: Build fixture export
        run: cargo run --example fixture_export -- target/fixture-export
      - name: Install e2e dependencies
        working-directory: crates/webspec-index-wasm/e2e
        run: npm ci && npx playwright install --with-deps firefox
      - name: Run e2e
        working-directory: crates/webspec-index-wasm/e2e
        run: node run.mjs ../../../target/fixture-export

  web:
    name: Web app (unit + Firefox e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Build wasm package
        run: ./crates/webspec-index-wasm/build.sh
        env:
          CC_wasm32_unknown_unknown: clang
      - name: Build fixture export
        run: cargo run --example fixture_export -- target/fixture-export
      - name: Install
        working-directory: web
        run: npm ci && npx playwright install --with-deps firefox
      - name: Unit tests and types
        working-directory: web
        run: npm test && npx tsc --noEmit
      - name: Build
        working-directory: web
        run: npm run build:e2e
      - name: End to end
        working-directory: web
        run: npm run e2e
