schema: 1
package: webspec-index
types:
  - id: html-media-element-alias
    type: HTML#media-element
    alias_of: idl:HTMLMediaElement
    expect_text: 'HTMLMediaElement objects .* are simply known as media elements'
    reason: '"media element" is defined as HTMLMediaElement instances; names differ.'
  - id: dom-traversal-participants
    type: DOM#traversal            # the "Traversal" heading; no dfn defines "traversal"
    name: traversal                # binds data-dfn-for="traversal" (§6.3 step 5)
    kind: concept
    implemented_by: [idl:NodeIterator, idl:TreeWalker]   # adds supertype edges
    expect_text: '(?i)Each NodeIterator and TreeWalker object has an associated'
    reason: DOM declares traversal state once for both iterator interfaces.
  - id: dom-tree-participants
    type: DOM#concept-tree         # data-dfn-for="tree": parent, children, root, …
    implemented_by: [idl:Node]
    expect_text: '(?i)An object that participates in a tree has a parent'
    reason: Nodes are the tree participants in DOM, so Node's type view lists tree fields.
fields:
  - id: html-option-selectedness
    field: HTML#concept-option-selectedness
    owner: [HTML#the-option-element]
    type: boolean
    initial: false
    expect_text: '(?i)selectedness'
    reason: Declared in element-level prose that R2 does not match.
  - id: html-timeline-offset
    field: HTML#timeline-offset
    owner: [HTML#media-resource]
    type: {opaque: "a date and time"}
    expect_text: '(?i)known as the timeline offset'
    reason: Owner phrase "Some video files" is not a type.
rules:
  - id: add-to-field-collection
    description: Unlinked "Add X to R's F" adds to a set- or list-valued field.
    match:
      text: '(?:^|, then |; )Add (?P<operand>.+?) to (?P<target>(?:the |this )?\S.*?)(?:\.|,|;|$)'
      exclude_text: ['(?i)\badd \S+ to \*\w+\*(?:\.|$)']   # local accumulators
    emit:
      kind: state.mutate
      params:
        op: append
        target: {capture: target, from: path}
        operand: {capture: operand, from: text}
  - id: decrease-by
    match:
      text: '(?:^|, |and )decrease (?P<target>.+?) by '
    emit:
      kind: state.mutate
      params: {op: decrement, target: {capture: target, from: path}}
  - id: html-canvas-reset-transform
    description: >-
      "The resetTransform() method, when invoked, must reset the current transformation
      matrix to the identity matrix." "Reset" is not a grammar verb, so the IR leaves the
      occurrence unclassified.
    match:
      subject: HTML#dom-context-2d-resettransform
      text: 'must reset the current transformation matrix to '
    emit:
      kind: state.write
      params: {field: HTML#current-transformation-matrix, op: set}
