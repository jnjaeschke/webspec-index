[package]
name = "webspec-index"
version = "0.14.0"
edition = "2021"
description = "Query WHATWG/W3C/TC39 web specifications from the command line"
license = "MIT"
repository = "https://github.com/jnjaeschke/webspec-index"
exclude = ["editors/", "bindings/", ".github/", "skills/", "csswg-drafts/", "groups/", "crates/"]

[lib]
name = "webspec_index"

[[bin]]
name = "webspec-index"
path = "src/main.rs"
required-features = ["native"]

[[example]]
name = "effects_parity"
required-features = ["native"]

[[example]]
name = "incremental_parity"
required-features = ["native"]

[[example]]
name = "slice_stats"
required-features = ["native"]

[[example]]
name = "state_golden"
required-features = ["native"]

[[example]]
name = "spec_fuzz"
path = "examples/spec_fuzz/main.rs"
required-features = ["native"]

[features]
default = ["native", "pdf"]
native = [
    "dep:tokio",
    "dep:reqwest",
    "dep:tower-lsp",
    "dep:dashmap",
    "dep:dirs",
    "dep:libc",
    "dep:clap",
    "dep:moz-cli-version-check",
    "dep:async-trait",
    "dep:strsim",
    "dep:rayon",
]
pdf = ["dep:lopdf", "dep:pdf-extract", "dep:euclid"]

[dependencies]
# HTML parsing
scraper = "0.25"
ego-tree = "0.10"
markup5ever_rcdom = "0.38"

# HTTP client
reqwest = { version = "0.13", features = ["gzip", "json"], optional = true }

# Database
rusqlite = { version = "0.39", features = ["bundled", "backup"] }

# Serialization
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_path_to_error = "0.1"
yaml-rust2 = { version = "0.10", default-features = false }

# CLI
clap = { version = "4.5", features = ["derive"], optional = true }

# Async runtime
tokio = { version = "1.49", features = ["full"], optional = true }

# Error handling
anyhow = "1.0"

# HTML to Markdown
htmd = "0.5"

# Markdown to HTML
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
percent-encoding = "2.3"
dirs = { version = "5", optional = true }
async-trait = { version = "0.1", optional = true }
sha2 = "0.10"

# LSP
tower-lsp = { version = "0.20", optional = true }
regex = "1"
strsim = { version = "0.11", optional = true }
rayon = { version = "1", optional = true }
dashmap = { version = "6", optional = true }

# Version checking
moz-cli-version-check = { version = "0.2", optional = true }

# SIGPIPE handling
libc = { version = "0.2", optional = true }

# Diffing
similar = "2"

# PDF parsing (ITU-T Recommendations)
lopdf = { version = "0.36", optional = true }
pdf-extract = { version = "0.9", optional = true }
euclid = { version = "0.20.5", optional = true }

[build-dependencies]
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.24"


[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
